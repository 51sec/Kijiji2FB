<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Kijiji to Marketplace</title>
  <style>
    body {
      width: 340px;
      font: 13px/1.4 -apple-system, Segoe UI, Roboto, sans-serif;
      margin: 0;
      padding: 12px;
      color: #1c1e21;
    }
    h1 {
      font-size: 15px;
      margin: 0 0 8px;
    }
    .hint {
      color: #65676b;
      margin-bottom: 12px;
    }
    .listing {
      display: flex;
      gap: 8px;
      padding: 8px;
      border: 1px solid #e4e6eb;
      border-radius: 8px;
      margin-bottom: 8px;
      align-items: center;
    }
    .listing img {
      width: 48px;
      height: 48px;
      object-fit: cover;
      border-radius: 6px;
      background: #f0f2f5;
      flex-shrink: 0;
    }
    .listing .info {
      flex: 1;
      min-width: 0;
    }
    .listing .info .title {
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .listing .info .meta {
      color: #65676b;
      font-size: 12px;
    }
    .listing .actions {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    button {
      font: inherit;
      cursor: pointer;
      border: none;
      border-radius: 6px;
      padding: 6px 10px;
    }
    .push {
      background: #1877f2;
      color: #fff;
    }
    .delete {
      background: #e4e6eb;
      color: #1c1e21;
    }
    .empty {
      color: #65676b;
      text-align: center;
      padding: 24px 0;
    }
    .quota {
      font-size: 12px;
      padding: 6px 10px;
      border-radius: 6px;
      margin-bottom: 10px;
      background: #f0f2f5;
      color: #444;
    }
    .quota.pro {
      background: #e7f3ff;
      color: #1877f2;
      font-weight: 600;
    }
    .quota.limit-reached {
      background: #fdecea;
      color: #a02622;
    }
    .upgrade {
      display: none;
      border: 1px solid #ffd9b3;
      background: #fff8f0;
      border-radius: 8px;
      padding: 10px;
      margin-bottom: 10px;
      font-size: 12px;
      color: #5a3d1a;
    }
    .upgrade.visible {
      display: block;
    }
    .upgrade a {
      color: #1877f2;
      font-weight: 600;
    }
    details.license {
      font-size: 12px;
      margin-top: 8px;
    }
    details.license summary {
      cursor: pointer;
      color: #65676b;
    }
    .license-form {
      display: flex;
      gap: 6px;
      margin-top: 6px;
    }
    .license-form input {
      flex: 1;
      font: inherit;
      padding: 6px 8px;
      border: 1px solid #ccd0d5;
      border-radius: 6px;
    }
    .license-status {
      margin-top: 4px;
      font-size: 12px;
    }
  </style>
</head>
<body>
  <h1>Kijiji to Marketplace</h1>
  <div class="hint">Open a Kijiji ad and click "Send to Facebook Marketplace" to capture it, then push it here.</div>
  <div id="quota" class="quota"></div>
  <div id="upgrade" class="upgrade">
    You've used all your free listings. Upgrade to
    <strong>Kijiji to Marketplace Pro</strong> for unlimited listings:
    <a id="upgrade-link" href="#" target="_blank" rel="noopener">get a license key</a>.
  </div>
  <div id="list"></div>
  <details class="license">
    <summary>Have a Pro license key?</summary>
    <div class="license-form">
      <input id="license-key" type="text" placeholder="License key" />
      <button id="activate-license" class="push">Activate</button>
    </div>
    <div id="license-status" class="license-status"></div>
  </details>
  <script src="popup.js"></script>
</body>
</html>
